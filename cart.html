<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinVerse — Cart</title>
    <link rel="icon" href="skinverse_logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Righteous&display=swap"
        rel="stylesheet">
</head>

<body class="subpage">

    <div class="page-frame">
    <div class="side-nav">
        <a class="logo-link" href="index.html">
            <div class="logo-bg1">
                <div class="logo-bg2"><img src="skinverse_logo.png" class="nav-logo" alt="SkinVerse logo"></div>
            </div>
        </a>
        <div class="nav-opt">
            <a class="nav-icon-link" href="search.html"><div class="nav-opt-bg"><i class="fa-solid fa-magnifying-glass"></i></div></a>
            <a class="nav-icon-link" href="shop.html"><div class="nav-opt-bg"><i class="fa-solid fa-table-cells-large"></i></div></a>
            <a class="nav-icon-link" href="cart.html"><div class="nav-opt-bg active"><i class="fa-solid fa-cart-shopping"></i><span class="nav-badge" data-badge="cart">0</span></div></a>
            <a class="nav-icon-link" href="wishlist.html"><div class="nav-opt-bg"><i class="fa-solid fa-heart"></i><span class="nav-badge" data-badge="wish">0</span></div></a>
            <a class="nav-icon-link" href="about.html" aria-label="About us"><div class="nav-opt-bg"><i class="fa-solid fa-circle-info"></i></div></a>
        </div>
        <div class="nav-user">
            <a class="nav-icon-link" href="account.html"><div class="nav-opt-bg"><i class="fa-solid fa-user-astronaut"></i></div></a>
        </div>
    </div>

    <div class="content-shell">
        <div class="shell-header">
            <a class="brand-mark" href="index.html">
                <img src="skinverse_logo.png" alt="">
                <span>SkinVerse</span>
            </a>
            <div class="title-block">
                <div class="page-title">Your cart</div>
                <div class="page-sub" id="lineCount"></div>
            </div>
        </div>

        <div id="cartRoot"></div>
    </div>

    </div>

    <script src="products.js"></script>
    <script>
        const DISCOUNTS = { "SKIN10": 0.10, "FIRSTRUN": 0.15, "GHOST07": 1.0 };  // GHOST07 = 100% off (college-demo code)
        let appliedCode = null;

        function render() {
            // Digital items (wallpapers, Rainmeter skins, etc.) are a single licence: clamp any qty > 1 back to 1.
            SKINVERSE.cartLines().forEach(l => {
                if (l.product.cat === "digital" && l.qty > 1) SKINVERSE.setQty(l.id, 1);
            });
            const lines = SKINVERSE.cartLines();
            const root = document.getElementById("cartRoot");
            const lineCount = document.getElementById("lineCount");
            lineCount.textContent = lines.length ? `${lines.length} item${lines.length === 1 ? "" : "s"}` : "";

            if (!lines.length) {
                root.innerHTML = `<div class="empty-state"><i class="fa-solid fa-cart-shopping"></i><p>Your cart is empty.</p></div>`;
                return;
            }

            const subtotal = SKINVERSE.cartSubtotal();
            const discountRate = appliedCode ? DISCOUNTS[appliedCode] : 0;
            const discountAmt = Math.round(subtotal * discountRate); // whole rupees
            const total = subtotal - discountAmt;

            root.innerHTML = `
                <div class="cart-layout">
                    <div>
                        ${lines.map(l => `
                            <div class="cart-line">
                                ${SKINVERSE.thumbHTML(l.product)}
                                <div>
                                    <div class="cart-line-name">${l.product.name}</div>
                                    <div class="cart-line-cat">${SKINVERSE.catLabel(l.product)} · ${SKINVERSE.money(l.product.price)}</div>
                                </div>
                                ${l.product.cat === "digital"
                                    ? `<div class="qty-fixed" style="font-size:13px;color:#9a9a9a;white-space:nowrap;"><i class="fa-solid fa-download"></i> Digital · 1 licence</div>`
                                    : `<div class="qty-stepper">
                                    <button onclick="SKINVERSE.setQty('${l.id}', ${l.qty - 1}); render();">−</button>
                                    <span>${l.qty}</span>
                                    <button onclick="SKINVERSE.setQty('${l.id}', ${l.qty + 1}); render();">+</button>
                                </div>`}
                                <div style="display:flex; align-items:center; gap:16px;">
                                    <span class="cart-line-price">${SKINVERSE.money(l.product.price * l.qty)}</span>
                                    <button class="cart-remove" onclick="SKINVERSE.removeFromCart('${l.id}'); render();"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        `).join("")}
                    </div>

                    <div class="summary-panel">
                        <h3>Order summary</h3>
                        <div class="discount-row">
                            <input id="discountInput" type="text" placeholder="Discount code" value="${appliedCode || ""}">
                            <button onclick="applyDiscount()">Apply</button>
                        </div>
                        <div class="summary-row"><span>Subtotal</span><span>${SKINVERSE.money(subtotal)}</span></div>
                        ${discountRate ? `<div class="summary-row"><span>Discount (${appliedCode})</span><span>−${SKINVERSE.money(discountAmt)}</span></div>` : ""}
                        <div class="summary-row"><span>Shipping</span><span>${lines.every(l => l.product.cat === "digital") ? "Free — digital" : "Calculated at checkout"}</span></div>
                        <div class="summary-row total"><span>Total</span><span>${SKINVERSE.money(total)}</span></div>
                        <div id="checkoutMsg" style="display:none;margin-top:12px;font-size:13px;line-height:1.5;color:#f0b3b3;"></div>
                        <button class="checkout-btn" onclick="checkout()">Checkout</button>
                    </div>
                </div>
            `;
        }

        function cartTotal() {
            const subtotal = SKINVERSE.cartSubtotal();
            const rate = appliedCode ? DISCOUNTS[appliedCode] : 0;
            return subtotal - Math.round(subtotal * rate);
        }

        function checkout() {
            // This demo has no payment gateway: an order only goes through when the total is ₹0 (code GHOST07).
            if (cartTotal() > 0) {
                const msg = document.getElementById("checkoutMsg");
                msg.style.display = "block";
                msg.textContent = "Online payment isn't connected in this demo. Apply a 100% coupon code to place the order.";
                return;
            }
            const lines = SKINVERSE.placeOrder();
            const root = document.getElementById("cartRoot");
            document.getElementById("lineCount").textContent = "";
            const digital = lines.filter(l => l.product.cat === "digital");
            const physical = lines.filter(l => l.product.cat !== "digital");

            const row = (l) => {
                const dl = SKINVERSE.downloadsFor(l.product);
                return `<div class="cart-line" style="grid-template-columns:auto 1fr;">
                    ${SKINVERSE.thumbHTML(l.product)}
                    <div>
                        <div class="cart-line-name">${l.product.name}</div>
                        <div class="cart-line-cat">${SKINVERSE.catLabel(l.product)}</div>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
                            ${dl.length
                                ? dl.map((d, i) => `<a class="checkout-btn" style="width:auto;text-decoration:none;margin-top:0;padding:9px 16px;font-size:13px;${i ? "background:#ffffff1f;" : "background:#2f8f4e;"}" href="${d.href}" download><i class="fa-solid fa-download"></i> ${d.label}</a>`).join("")
                                : `<span style="color:#9a9a9a;font-size:13px;"><i class="fa-regular fa-clock"></i> Download file coming soon</span>`}
                        </div>
                    </div>
                </div>`;
            };

            root.innerHTML = `
                <div class="empty-state" style="padding:30px 0;">
                    <i class="fa-solid fa-circle-check" style="color:#8fd19e;"></i>
                    <p style="font-size:20px;color:#ececec;">Order placed, thank you!</p>
                </div>
                <div style="display:grid;gap:14px;max-width:640px;margin:0 auto 20px;">${digital.map(row).join("")}</div>
                ${physical.length ? `<p style="text-align:center;color:#9a9a9a;">${physical.length} desk item${physical.length === 1 ? "" : "s"} added to your order (shipping is not part of this demo).</p>` : ""}
                <p style="text-align:center;margin-top:18px;"><a class="chip" style="text-decoration:none;" href="shop.html">Keep shopping</a></p>`;
        }

        function applyDiscount() {
            const code = document.getElementById("discountInput").value.trim().toUpperCase();
            appliedCode = DISCOUNTS[code] ? code : null;
            render();
            if (code && !appliedCode) { const m = document.getElementById("checkoutMsg"); m.style.display = "block"; m.textContent = "That code isn\u2019t valid."; }
        }

        render();
    </script>
</body>

</html>
