<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinVerse — Product</title>
    <link rel="icon" href="skinverse_logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="shop.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&family=Righteous&display=swap"
        rel="stylesheet">
    <style>
        .product-layout { display: grid; grid-template-columns: minmax(300px, 460px) 1fr; gap: 40px; align-items: start; }
        .product-hero-thumb.has-img { aspect-ratio: auto; display: block; padding: 0; overflow: hidden; font-size: 0; background: #14141a; }
        .product-hero-thumb.has-img img { display: block; width: 100%; height: auto; max-height: 560px; object-fit: contain; }
        .product-hero-thumb { width: 100%; aspect-ratio: 1/1; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 90px; color: #ffffffe6; box-shadow: inset 0 4px 30px #00000040, 0 8px 20px #00000060; }
        .product-cat { font-family: 'Righteous', sans-serif; font-size: 12px; color: #8a8a8a; }
        .product-name { font-family: 'Playfair', serif; font-size: 32px; color: #ececec; margin: 6px 0 4px; }
        .product-tagline { color: #9a9a9a; font-size: 15px; margin-bottom: 18px; }
        .product-price { font-family: 'Righteous', sans-serif; font-size: 26px; color: #e8e8e8; margin-bottom: 22px; }
        .product-desc { color: #b0b0b0; line-height: 1.7; max-width: 560px; margin-bottom: 26px; }
        .variant-label { font-size: 12px; color: #8a8a8a; margin-bottom: 10px; font-family: 'Righteous', sans-serif; }
        .variant-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .variant-chip { padding: 9px 16px; border-radius: 16px; border: 1px solid #fffbfb26; background: #111111db; color: #b5b5b5; font-size: 13px; cursor: pointer; transition: all 0.2s ease; }
        .variant-chip.selected { background: linear-gradient(97deg, rgba(203,202,202,1) 0%, rgba(120,118,118,1) 100%); color: #111; border-color: transparent; }
        .product-actions { display: flex; gap: 14px; }
        .related-block { margin-top: 50px; }
        .related-block h3 { font-family: 'Playfair', serif; color: #ececec; font-size: 18px; margin-bottom: 16px; }
        @media (max-width: 720px) { .product-layout { grid-template-columns: 1fr; } }
    </style>
</head>

<body class="subpage">

    <div class="page-frame">
    <div class="side-nav">
        <a class="logo-link" href="index.html">
            <div class="logo-bg1">
                <div class="logo-bg2"><img src="skinverse_logo.png" class="nav-logo" alt="SkinVerse logo"></div>
            </div>
        </a>
        <div class="nav-opt">
            <a class="nav-icon-link" href="search.html"><div class="nav-opt-bg"><i class="fa-solid fa-magnifying-glass"></i></div></a>
            <a class="nav-icon-link" href="shop.html"><div class="nav-opt-bg"><i class="fa-solid fa-table-cells-large"></i></div></a>
            <a class="nav-icon-link" href="cart.html"><div class="nav-opt-bg"><i class="fa-solid fa-cart-shopping"></i><span class="nav-badge" data-badge="cart">0</span></div></a>
            <a class="nav-icon-link" href="wishlist.html"><div class="nav-opt-bg"><i class="fa-solid fa-heart"></i><span class="nav-badge" data-badge="wish">0</span></div></a>
            <a class="nav-icon-link" href="about.html" aria-label="About us"><div class="nav-opt-bg"><i class="fa-solid fa-circle-info"></i></div></a>
        </div>
        <div class="nav-user">
            <a class="nav-icon-link" href="account.html"><div class="nav-opt-bg"><i class="fa-solid fa-user-astronaut"></i></div></a>
        </div>
    </div>

    <div class="content-shell">
        <div class="shell-header">
            <a class="brand-mark" href="index.html">
                <img src="skinverse_logo.png" alt="">
                <span>SkinVerse</span>
            </a>
            <div class="title-block">
                <a href="#" id="backLink" class="chip" style="text-decoration:none;"><i class="fa-solid fa-arrow-left" style="margin-right:8px;"></i>Back to catalogue</a>
            </div>
        </div>

        <div id="productRoot"></div>

        <div class="related-block" id="relatedBlock" style="display:none;">
            <h3>You might also like</h3>
            <div class="product-grid" id="relatedGrid"></div>
        </div>
    </div>

    </div>

    <script src="products.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const product = SKINVERSE.getProduct(params.get("id")) || SKINVERSE.PRODUCTS[0];
        document.title = `SkinVerse — ${product.name}`;
        document.getElementById("backLink").href = product.cat === "digital" ? "digital.html" : "desk.html";

        document.getElementById("productRoot").innerHTML = `
            <div class="product-layout">
                <div class="product-hero-thumb has-img swatch-${product.swatch}"><img src="${product.img}" alt="${product.name}"></div>
                <div>
                    <div class="product-cat">${SKINVERSE.catLabel(product)}</div>
                    <h1 class="product-name">${product.name}</h1>
                    <p class="product-tagline">${product.tagline}</p>
                    <div class="product-price">${SKINVERSE.money(product.price)}</div>
                    <p class="product-desc">${product.desc}</p>
                    ${product.variants.length > 1 ? `
                    <div class="variant-label">${product.sub === "cursor" ? "Size" : "Resolution"}</div>
                    <div class="variant-row">
                        ${product.variants.map((v, i) => `<div class="variant-chip ${i === 0 ? "selected" : ""}" onclick="document.querySelectorAll('.variant-chip').forEach(c=>c.classList.remove('selected')); this.classList.add('selected');">${v}</div>`).join("")}
                    </div>` : ""}
                    <div class="product-actions">
                        ${SKINVERSE.isOwned(product.id) && SKINVERSE.downloadsFor(product).length
                            ? SKINVERSE.downloadsFor(product).map(d => `<a class="checkout-btn" style="width:auto; padding:13px 26px; margin-top:0; text-decoration:none; background:#2f8f4e;" href="${d.href}" download><i class="fa-solid fa-download"></i> ${d.label}</a>`).join("")
                            : `<button class="checkout-btn" style="width:auto; padding:13px 26px; margin-top:0;" onclick="SKINVERSE.addToCart('${product.id}'); SKINVERSE.pulse(this);">Add to cart</button>`}
                        <button class="card-wish ${SKINVERSE.isWished(product.id) ? "active" : ""}" style="position:static; width:48px; height:48px;" onclick="SKINVERSE.toggleWishlist('${product.id}'); this.classList.toggle('active');">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                    </div>
                </div>
            </div>
        `;

        const related = SKINVERSE.PRODUCTS.filter(p => p.cat === product.cat && p.id !== product.id).slice(0, 4);
        if (related.length) {
            document.getElementById("relatedBlock").style.display = "block";
            SKINVERSE.renderGrid("#relatedGrid", related);
        }
    </script>
</body>

</html>
